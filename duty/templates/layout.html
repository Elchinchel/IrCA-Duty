<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="Content-Language" content="ru">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="theme-color" content="#151515">
  <meta name="msapplication-navbutton-color" content="#151515">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#151515">

  <meta property="og:image" content="/static/img/og.png" />
  <meta property="og:title" content="IrCA Duty" />
  <meta property="og:description" content="Веб-морда" />

  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noto+Sans&display=swap&subset=cyrillic">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <link rel="stylesheet" href="/static/css/style.css" type="text/css">
  <link rel="stylesheet" href="/static/css/theme.css" type="text/css">

  <title>IrCA Duty</title>
</head>

<body class="d-flex flex-column" style="background-color: #1E1E1E">
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">
        <b>IrCA Duty</b>
      </a>
    </div>
  </nav>

  <div id="cookies-js-alerts">
    <noscript>
      <div class="py-12">
        <div class="container">
          <div class="row">
            <p>Для работы сайта требуются javascript и cookies, включи их</p>
          </div>
        </div>
      </div>
    </noscript>

    <div class="py-5" id="cookies-blocked">
      <div class="container">
        <div class="row">
          <div class="col-md-12">
            <p>Для работы сайта требуются cookies, включи их</p>
            <script>
              if (navigator.cookieEnabled) {
                document.getElementById("cookies-blocked").hidden = true;
              }
            </script>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <div id="page-content">
    {% block pagecontent %}
    {% endblock pagecontent %}
  </div>

  <footer id="sticky-footer" class="py-5 bg-dark text-white-50">
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm text-md-right text-center">
          <small style="font-size: 13px;color: #efa73c;">Евгений Лисицын</small>
          <a href="https://github.com/Obnovlator3000" style="text-decoration: none;">
            <svg width="70" height="21" viewBox="0 0 76 24.9">
              <use href="/static/img/github.svg#ghLogo" fill="#efa73c" />
            </svg>
          </a>
          <a href="https://vk.com/id230192963">
            <svg width="29" height="29" viewBox="0 0 2.34 2.34">
              <use href="/static/img/vk.svg#vkBase" fill="#efa73c" />
              <use href="/static/img/vk.svg#vkLogo" />
            </svg>
          </a>
        </div>
        <div class="d-sm-none">
          <div class="p-1"></div>
        </div>
        <div class="col-sm text-center">
          <small style="font-size: 13px;color: #39eb51;">Иосиф Александрович</small>
          <a href="https://github.com/Elchinchel" style="text-decoration: none;">
            <svg width="70" height="21" viewBox="0 0 76 24.9">
              <use href="/static/img/github.svg#ghLogo" fill="#39eb51" />
            </svg>
          </a>
          <a href="https://vk.com/iosiphpage">
            <svg width="29" height="29" viewBox="0 0 2.34 2.34">
              <use href="/static/img/vk.svg#vkBase" fill="#39eb51" />
              <use href="/static/img/vk.svg#vkLogo" />
            </svg>
          </a>
        </div>
        <div class="d-sm-none">
          <div class="p-1"></div>
        </div>
        <div class="col-sm text-md-left text-center">
          <small style="font-size: 13px;color: #c00ded;">Мария Громова</small>
          <a href="https://vk.com/id549315693">
            <svg width="40" height="27" viewBox="0 0 256 256">
              <use href="/static/img/heart.svg#heart" />
            </svg>
          </a>
          <a href="https://vk.com/id549315693">
            <svg width="29" height="29" viewBox="0 0 2.34 2.34">
              <use href="/static/img/vk.svg#vkBase" fill="#c00ded" />
              <use href="/static/img/vk.svg#vkLogo" />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </footer>

</body>

</html>
